{% set name = "radian" %}
{% set version = "0.7.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/radian-{{ version }}.tar.gz
  sha256: 55081f1021dd0987ae74af171c964e3b54602ab852a1b9e6fbe3aca56522101a

build:
  number: 0
  noarch: python
  entry_points:
    - radian = radian:main
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - pytest-runner
    - python {{ python_min }}
  run:
    - pygments >=2.5.0
    - python >={{ python_min }}
    - prompt_toolkit >=3.0.41,<3.1
    - rchitect >=0.4.8,<0.5.0

test:
  imports:
    - radian
    - radian.latex
  commands:
    - pip check
    - radian --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/randy3k/radian
  summary: A 21 century R console
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - randy3k
    - jdblischak
